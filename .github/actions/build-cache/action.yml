name: Restore the build cache
description: >-
  Restores a target directory as the last master build on this platform and toolchain left it, its
  sources stamped with mtimes cjpm's incremental cache can match (D27, D28). Saving is the
  workflow's call, under `key` and `path`.

inputs:
  runner-image:
    description: The runner label; compiled objects must not cross Linux userspace versions.
    required: true
  target-dir:
    description: The target directory, `target/release` for `cjpm build`, `target/test` for the tests.
    required: true

outputs:
  key:
    description: The key to save the cache under once the build is green.
    value: ${{ steps.key.outputs.key }}
  path:
    description: What to save, the paths restored.
    value: ${{ steps.key.outputs.path }}

runs:
  using: composite
  steps:
    # one cache per target directory: the build's and the tests' jobs run beside each other (D96)
    - id: key
      shell: bash
      env:
        DIR: ${{ inputs.target-dir }}
      run: |
        echo "prefix=cjpm-${DIR//\//-}-${{ inputs.runner-image }}-${{ runner.arch }}-${{ hashFiles('.cangjie-version') }}-" >> "$GITHUB_OUTPUT"
        echo "key=cjpm-${DIR//\//-}-${{ inputs.runner-image }}-${{ runner.arch }}-${{ hashFiles('.cangjie-version') }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
        # build.cj's stamp of the compiler goes with it: without it, the build forgets what it restored
        printf 'path<<EOF\n%s\ntarget/cjc-version\nbuild-script-cache\nEOF\n' "$DIR" >> "$GITHUB_OUTPUT"

    - shell: bash
      run: python "$GITHUB_ACTION_PATH/stamp.py"

    - uses: actions/cache/restore@v4
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
