name: macOS runtime probe

on:
  push:
    branches: [test/macos-nightly-20261022]
  workflow_dispatch:
    inputs:
      sdk:
        description: SDK series to probe
        type: choice
        default: 1.2.0
        options: [1.2.0, nightlies]

permissions:
  contents: read

jobs:
  probe:
    name: Runtime (${{ matrix.sdk }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(inputs.sdk == 'nightlies' && '["1.3.0-alpha.20261014001050", "1.3.0-alpha.20261022001052"]' || '["1.2.0"]') }}
    steps:
      - uses: actions/checkout@v7
      # Keep the source and corpus identical; only the selected SDK/stdx changes.
      - name: Select probe SDK
        if: matrix.sdk != '1.2.0'
        env:
          PROBE_SDK: ${{ matrix.sdk }}
        run: |
          printf '%s\n' "$PROBE_SDK" > .cangjie-version
          cat .github/macos-nightly.sha256 >> .cangjie-sha256
      - uses: ./.github/actions/setup-cangjie
        if: matrix.sdk != '1.2.0'
      - uses: actions/setup-python@v5
        if: matrix.sdk == '1.2.0'
        with:
          python-version: "3.12"
      - name: Install release SDK and matching stdx
        if: matrix.sdk == '1.2.0'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import runpy
          import sys

          setup = runpy.run_path(".github/actions/setup-cangjie/setup.py")
          dest = Path(os.environ["RUNNER_TEMP"]) / "release-sdk"
          dest.mkdir()
          home = dest / "cangjie"
          for asset in json.loads(Path(".github/macos-release.json").read_text()):
              archive = dest / asset["name"]
              with archive.open("wb") as out:
                  actual = setup["download"](asset["url"], out)
              if actual != asset["sha256"]:
                  raise SystemExit(f"checksum mismatch: {asset['name']}: {actual}")
              target = dest / asset["dest"]
              if archive.name == "Tokens.inc":
                  # Release macOS SDKs omit include/. Tests need the matching
                  # compiler token enum, not a nightly's different numbering.
                  target.parent.mkdir(parents=True, exist_ok=True)
                  archive.rename(target)
              else:
                  target.mkdir(parents=True, exist_ok=True)
                  setup["unpack"](str(archive), str(target))
                  archive.unlink()
          # Reuse the installer's environment handling after staging the archives.
          sys.argv = ["setup.py", "1.2.0", str(dest)]
          setup["main"]()
          with open(os.environ["GITHUB_PATH"], "a") as out:
              out.write(str(Path(".github/actions/setup-cangjie/shim").resolve()) + "\n")
      - name: Record environment
        run: |
          mkdir -p probe-logs
          {
            git rev-parse HEAD
            sw_vers
            uname -a
            cjc --version
            cjpm --version
            sysctl -n hw.model hw.ncpu hw.memsize
            uptime
          } | tee probe-logs/environment.txt
      - name: Adapt sealed matches for the release compiler
        if: matrix.sdk == '1.2.0'
        # 1.2 does not recognize the exhaustive Leaf/Branch cases of sealed Node.
        # Keep this experiment-only change explicit in the downloaded evidence.
        run: |
          git apply .github/sdk-1.2-exhaustiveness.patch
          git diff -- modules/rope/src/node.cj > probe-logs/compatibility.patch
      - run: python3 tests/corpora/fetch.py
      - name: Compile tests without running
        run: |
          set -o pipefail
          cjpm test --no-run --no-progress --target-dir target/test 2>&1 | tee probe-logs/build.txt
      - name: Repeat full suite and isolated gate
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          # A fresh process per repetition also exercises runtime initialization.
          base = ["cjpm", "test", "--skip-build", "--no-progress",
                  "--timeout-each=2m", "--target-dir", "target/test"]
          runs = [(f"full-{i}", []) for i in range(1, 4)]
          runs += [(f"gate-{i}", ["--filter=ServedDiagnosticsGateTest.*"])
                   for i in range(1, 11)]
          results = []
          for name, args in runs:
              started = time.monotonic()
              with open(f"probe-logs/{name}.txt", "w") as log:
                  try:
                      result = subprocess.run(base + args, stdout=log,
                                              stderr=subprocess.STDOUT, timeout=600)
                      status = result.returncode
                  except subprocess.TimeoutExpired:
                      status = "timeout"
              row = {"run": name, "status": status,
                     "seconds": round(time.monotonic() - started, 2)}
              results.append(row)
              print(json.dumps(row), flush=True)
              Path("probe-logs/results.json").write_text(json.dumps(results, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| Run | Exit status | Seconds |\n|---|---|---|\n")
              for row in results:
                  summary.write(f"| {row['run']} | {row['status']} | {row['seconds']} |\n")
          if any(row["status"] != 0 for row in results):
              raise SystemExit(1)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-runtime-${{ matrix.sdk }}
          path: probe-logs
          if-no-files-found: error
