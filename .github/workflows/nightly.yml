name: Nightly

# The rolling pre-release `nightly-build` (D32, D39): the binaries of master's newest commit CI
# passed on, packaged as a release is, so a client follows master by a tag name alone. Nothing to do
# when that commit is the nightly already.
on:
  schedule:
    - cron: "17 3 * * *" # every night, 03:17 UTC: off the hour, when GitHub delays schedules least
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the release
      actions: read # the artifacts of CI's run
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: nightly-build
    steps:
      - name: Master's newest green commit
        id: green
        run: |
          # the newest runs, filtered here: the API's own `status=success` filter returned a run of two
          # days before for a day (2026-10-05) while newer ones had passed
          read -r run sha < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --event push \
            --limit 30 --json databaseId,headSha,conclusion \
            --jq 'map(select(.conclusion == "success")) | .[0] // empty | "\(.databaseId) \(.headSha)"') || true
          if [ -z "$sha" ]; then
            echo "::notice::CI has not passed on master yet"
            exit 0
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          if [ "$current" = "$sha" ]; then
            echo "::notice::the nightly is $sha already"
            exit 0
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - if: steps.green.outputs.sha
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.green.outputs.sha }}
          fetch-depth: 0
      # the binaries that CI run built and tested end to end, not a build of our own
      - if: steps.green.outputs.sha
        run: gh run download "${{ steps.green.outputs.run }}" --pattern 'cjls-*' --dir artifacts
      - if: steps.green.outputs.sha
        run: .github/scripts/package.sh artifacts dist
      - if: steps.green.outputs.sha
        name: Notes
        env:
          SHA: ${{ steps.green.outputs.sha }}
        run: |
          since=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
          {
            echo "Master at ${SHA:0:12}, $(git show -s --format=%cs "$SHA"): its newest commit CI passed on. Updated every night; it reports the version of its sources."
            echo
            if [ -n "$since" ]; then
              echo "Since $since:"
              echo
              git log --no-merges --format='- %s' "$since..$SHA"
            fi
          } > notes.md
      # made once, then updated in place: the tag moves, the assets (their names never change) are
      # replaced. Never deleted: a tag an immutable release had can never be made again (D39).
      - if: steps.green.outputs.sha
        name: Release
        env:
          SHA: ${{ steps.green.outputs.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$SHA" -F force=true --silent
            gh release edit "$TAG" --target "$SHA" --notes-file notes.md # targetCommitish: what clients compare
          else
            gh release create "$TAG" dist/* --prerelease --latest=false --target "$SHA" --title nightly --notes-file notes.md
          fi
