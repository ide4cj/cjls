name: Nightly

# The rolling pre-release `nightly` (D32): the binaries of master's newest commit CI passed on,
# packaged as a release is, so a client follows master by a tag name alone. Nothing to do when that
# commit is the nightly already.
on:
  schedule:
    - cron: "0 3 * * *" # every night, 03:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the release
      actions: read # the artifacts of CI's run
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Master's newest green commit
        id: green
        run: |
          read -r run sha < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --event push \
            --status success --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"') || true
          if [ -z "$sha" ]; then
            echo "::notice::CI has not passed on master yet"
            exit 0
          fi
          current=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ "$current" = "$sha" ]; then
            echo "::notice::the nightly is $sha already"
            exit 0
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - if: steps.green.outputs.sha
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.green.outputs.sha }}
          fetch-depth: 0
      # the binaries that CI run built and tested end to end, not a build of our own
      - if: steps.green.outputs.sha
        run: gh run download "${{ steps.green.outputs.run }}" --pattern 'cjls-*' --dir artifacts
      - if: steps.green.outputs.sha
        run: .github/scripts/package.sh artifacts dist
      - if: steps.green.outputs.sha
        name: Notes
        env:
          SHA: ${{ steps.green.outputs.sha }}
        run: |
          since=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
          {
            echo "Master at ${SHA:0:12}, $(git show -s --format=%cs "$SHA"): its newest commit CI passed on. Replaced every night; it reports the version of its sources."
            echo
            if [ -n "$since" ]; then
              echo "Since $since:"
              echo
              git log --no-merges --format='- %s' "$since..$SHA"
            fi
          } > notes.md
      # deleted and made again: a release's tag cannot move, and the assets keep their names
      - if: steps.green.outputs.sha
        name: Release
        env:
          SHA: ${{ steps.green.outputs.sha }}
        run: |
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly dist/* --prerelease --latest=false --target "$SHA" --title nightly --notes-file notes.md
