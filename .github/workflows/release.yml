name: Release

# `cog bump --auto` pushes the tag
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the binaries CI built and tested end to end
      - uses: actions/download-artifact@v8
        with:
          pattern: cjls-*
          path: artifacts
      - name: Package
        run: .github/scripts/package.sh artifacts dist
      # the tag's section of CHANGELOG.md, written by hand or by cog alike (D21)
      - name: Notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            function heads(h) { return index($0, h) == 1 && substr($0, length(h) + 1, 1) ~ /^( |$)/ }
            heads("## " tag) || index($0, "## [" tag "]") == 1 { on = 1; next }
            on && /^(- - -|## )/ { exit }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
