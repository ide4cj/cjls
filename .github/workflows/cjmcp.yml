name: MCP Linux artifact

on:
  push:
    branches: [experiment/cjmcp]
  pull_request:
    branches: [experiment/cjmcp]
  workflow_dispatch:

concurrency:
  group: cjmcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Build and verify MCP (Linux x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cangjie
      - uses: ./.github/actions/setup-cjmcp-python
      - uses: ./.github/actions/build-cache
        with:
          target-dir: target/release
          runner-image: ubuntu-22.04
      - name: Build MCP
        run: cjpm build -m modules/cjmcp
      - name: MCP protocol unit tests
        run: cjpm test -m modules/cjmcp --no-progress --timeout-each=2m --target-dir target/test
      - name: Package
        run: bash .github/scripts/package-cjmcp.sh target/release/bin/cjmcp dist
      - name: Verify delivered binary
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          mkdir unpacked
          tar -xzf cjmcp-*.tar.gz -C unpacked
          binary=$(realpath unpacked/cjmcp-*/cjmcp)
          "$binary" --help
          cd ..
          CJMCP_BIN="$binary" python3 -m unittest discover -s tests/mcp -v
      - uses: actions/upload-artifact@v7
        with:
          name: cjmcp-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  python-compatibility:
    name: Verify MCP (CPython ${{ matrix.python }})
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cangjie
      # The test driver uses modern pathlib; PYTHON_DYNLIB selects the embedded runtime separately.
      - uses: actions/setup-python@v5
        id: test-driver
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-cjmcp-python
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: cjmcp-linux-x86_64-${{ github.sha }}
          path: dist
      - name: Verify delivered binary with selected CPython
        env:
          TEST_PYTHON: ${{ steps.test-driver.outputs.python-path }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          mkdir unpacked
          tar -xzf cjmcp-*.tar.gz -C unpacked
          binary=$(realpath unpacked/cjmcp-*/cjmcp)
          cd ..
          # PYTHONHOME belongs to the embedded runtime, not the test driver.
          CJMCP_BIN="$binary" CJMCP_PYTHONHOME="$PYTHONHOME" \
            env -u PYTHONHOME "$TEST_PYTHON" -m unittest discover -s tests/mcp -v
