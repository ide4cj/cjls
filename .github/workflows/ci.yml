name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      # a squash merge makes the title the commit on master, and `cog bump` reads that
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$TITLE"

  docs:
    name: Docs ids
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the ADR numbers the open PRs took
    steps:
      - uses: actions/checkout@v7
      - name: Test scripts/docs.py
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Test SDK environment setup
        run: python3 -m unittest discover -s .github/actions/setup-cangjie -p '*_test.py'
      - name: Test SDK window runner
        run: python3 -m unittest discover -s .github/scripts -p '*_test.py'
      - name: Test semantic oracle contracts
        run: python3 -m unittest discover -s tests/semantic -p '*_test.py'
      # every ADR number and rule id once, every ADR header readable; on a PR, its ADR numbers
      # not taken by an older open PR (D56)
      - name: Every id once
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/docs.py check ${PR:+--open-prs "$PR"}

  # the binary, for e2e and perf, beside the tests rather than before them: neither waits for the
  # other, and each keeps its own target directory and cache (D27, D96)
  build:
    # The experiment has its own Linux MCP delivery check; the full-ci label opts into full CI.
    if: github.base_ref != 'experiment/cjmcp' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Link against the oldest supported Linux userspace, not the moving latest runner.
        os: [macos-latest, ubuntu-22.04, windows-latest]
    # Temporary until the SDK GC-root crash is fixed and revalidated (#466).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cangjie
      # incremental from what master last built; a release, on a tag, is built clean (D27)
      - id: cache
        if: github.ref_type != 'tag'
        uses: ./.github/actions/build-cache
        with:
          target-dir: target/release
          runner-image: ${{ matrix.os }}
      - run: cjpm build
        shell: bash
      - uses: ./.github/actions/setup-cjmcp-python
        if: runner.os == 'Linux'
      - name: MCP stdio experiment
        run: python -m unittest discover -s tests/mcp -v
        shell: bash
      - name: Linux runtime compatibility (Ubuntu 22.04)
        if: runner.os == 'Linux'
        run: bash .github/scripts/check-linux-compat.sh target/release/bin/cjls
      - uses: actions/upload-artifact@v7
        with:
          name: cjls-${{ runner.os }}
          path: target/release/bin/cjls${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
      # master's alone, so a PR never starts from another PR's build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}

  # the name the ruleset requires; `cjpm test` compiles the libraries again, for tests, in a target
  # directory of its own: in the build's, each would undo the other's incremental cache
  test:
    # The experiment has its own Linux MCP delivery check; the full-ci label opts into full CI.
    if: github.base_ref != 'experiment/cjmcp' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    # Temporary until the SDK GC-root crash is fixed and revalidated (#466).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    # a hang fails the job in minutes, not GitHub's six hours; the longest case takes seconds
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cangjie
      - id: cache
        if: github.ref_type != 'tag'
        uses: ./.github/actions/build-cache
        with:
          target-dir: target/test
          runner-image: ${{ matrix.os }}
      - run: python tests/corpora/fetch.py
        shell: bash
      - run: cjpm test --no-progress --timeout-each=2m --target-dir target/test
        shell: bash
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}

  sdk-window-matrix:
    name: Supported SDK versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.window.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: window
        run: echo "matrix=$(python3 .github/scripts/sdk_window.py matrix)" >> "$GITHUB_OUTPUT"

  sdk-window:
    name: SDK std and e2e (${{ matrix.channel }} ${{ matrix.version }})
    needs: [build, sdk-window-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sdk-window-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cangjie
      - if: github.ref_type != 'tag'
        uses: ./.github/actions/build-cache
        with:
          target-dir: target/test
          runner-image: ubuntu-latest
      - run: python3 tests/corpora/fetch.py
      # Only the pin compiles these binaries. CANGJIE_HOME changes when they run below.
      - run: cjpm test --no-run --target-dir target/test
      - uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/cangjie/${{ matrix.version }}
          key: cangjie-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ hashFiles('.cangjie-sha256') }}
      - name: Install SDK under test without replacing the build environment
        env:
          SDK_VERSION: ${{ matrix.version }}
        run: |
          dest="$RUNNER_TOOL_CACHE/cangjie/$SDK_VERSION"
          env -u GITHUB_ENV -u GITHUB_PATH python3 .github/actions/setup-cangjie/setup.py "$SDK_VERSION" "$dest" > /dev/null
          echo "CJLS_E2E_SDK=$dest/cangjie" >> "$GITHUB_ENV"
          echo "CJLS_TEST_STD_SOURCES=$(python3 tests/corpora/fetch.py --sdk-version "$SDK_VERSION")" >> "$GITHUB_ENV"
      - name: Read this SDK's std
        run: python3 .github/scripts/sdk_window.py test "$CJLS_E2E_SDK"
      - uses: actions/download-artifact@v8
        with:
          name: cjls-Linux
          path: bin
      - run: chmod +x bin/cjls
      - uses: astral-sh/setup-uv@v7
      - name: pytest-lsp on this SDK
        env:
          CJLS_BIN: ${{ github.workspace }}/bin/cjls
        # cjpm needs the pin's runtime in the test driver; conftest removes SDK variables only
        # from the server child. Let the stdx case discover this release's matching binaries.
        run: env -u CANGJIE_STDX_PATH uv run --project tests/e2e --locked pytest tests/e2e

  # the coverage-guided fuzzers with the comparisons fjson and jsonrpc make fed back to them, in a
  # target dir of their own; the heap is for cjc's instrumentation, which leaks on every match of
  # an enum (D24)
  fuzz:
    # The experiment has its own Linux MCP delivery check; the full-ci label opts into full CI.
    if: github.base_ref != 'experiment/cjmcp' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: Fuzz (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cangjie
      - run: python tests/corpora/fetch.py
        shell: bash
      - run: cjpm test --no-progress --fuzz --target-dir target/fuzz '--filter=*CoverageGuided*.*'
        env:
          cjHeapSize: 2GB

  e2e:
    name: End-to-end (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    # Temporary until the SDK GC-root crash is fixed and revalidated (#466).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # no SDK in the environment: the binary has to run the way an editor starts it
    env:
      CJLS_BIN: ${{ github.workspace }}/bin/cjls${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cjls-${{ runner.os }}
          path: bin
      - run: chmod +x "$CJLS_BIN"
        shell: bash
      # std's `.cjo` and sources for the case going into them, which passes them as an editor does,
      # in `initializationOptions`: the SDK from the build's cache, its environment left unset
      - id: version
        shell: bash
        run: echo "tag=$(tr -d '[:space:]' < .cangjie-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/cangjie/${{ steps.version.outputs.tag }}
          key: cangjie-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.tag }}-${{ hashFiles('.cangjie-sha256') }}
      - shell: bash
        run: |
          dest="${{ runner.tool_cache }}/cangjie/${{ steps.version.outputs.tag }}"
          env -u GITHUB_ENV -u GITHUB_PATH python .github/actions/setup-cangjie/setup.py "${{ steps.version.outputs.tag }}" "$dest" > /dev/null
          echo "CJLS_E2E_SDK=$dest/cangjie" >> "$GITHUB_ENV"
      - run: python tests/corpora/fetch.py cangjie_runtime
        shell: bash
      - uses: astral-sh/setup-uv@v7
      - name: pytest-lsp
        run: uv run --project tests/e2e --locked pytest tests/e2e
        shell: bash

  # Product sources, excluding negative oracle fixtures with intentional syntax/layout.
  format:
    name: Format
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cjls-Linux
          path: bin
      - run: chmod +x bin/cjls
      - name: cjls fmt --check
        run: bin/cjls fmt --check build.cj modules

  # a report per commit, kept as an artifact; the times are only reported, shared runners are too
  # noisy to fail on (D23), the queries executed are held to tests/perf/thresholds.toml (D81)
  perf:
    name: Performance (ubuntu-latest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CJLS_BIN: ${{ github.workspace }}/bin/cjls
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cjls-Linux
          path: bin
      - run: chmod +x "$CJLS_BIN"
      - uses: astral-sh/setup-uv@v7
      # std's sources, the workspace of the references scenario
      - run: python3 tests/corpora/fetch.py cangjie_runtime
      - name: cjls-perf
        run: |
          uv run --project tests/perf --locked cjls-perf run --server cjls -o perf.json
          uv run --project tests/perf --locked cjls-perf compare perf.json >> "$GITHUB_STEP_SUMMARY"
      - name: thresholds
        run: |
          set -o pipefail
          uv run --project tests/perf --locked cjls-perf check perf.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-${{ github.sha }}
          path: |
            perf.json
            perf-logs

  semantic-oracle:
    name: Semantic oracle (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    # Same temporary SDK GC exception as the other macOS checks (#466).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cangjie
      - uses: actions/download-artifact@v8
        with:
          name: cjls-${{ runner.os }}
          path: bin
      - name: Test oracle contracts and platform process cleanup
        shell: bash
        run: python -m unittest discover -s tests/semantic -p '*_test.py'
      - name: Compiler and LSP matrix
        shell: bash
        run: |
          server="bin/cjls${{ runner.os == 'Windows' && '.exe' || '' }}"
          chmod +x "$server"
          python tests/semantic/oracle.py --server "$server" --output target/semantic-oracle
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantic-oracle-${{ runner.os }}-${{ github.sha }}
          path: target/semantic-oracle
          if-no-files-found: error
