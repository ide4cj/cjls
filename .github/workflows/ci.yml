name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      # a squash merge makes the title the commit on master, and `cog bump` reads that
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$TITLE"

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # a hang fails the job in minutes, not GitHub's six hours; the longest case takes seconds
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cangjie
      # incremental from what master last built; a release, on a tag, is built clean (D27)
      - id: cache
        if: github.ref_type != 'tag'
        uses: ./.github/actions/build-cache
      - run: cjpm build
        shell: bash
      - run: python tests/corpora/fetch.py
        shell: bash
      # beside the build's, not over it: each would undo the other's incremental cache
      - run: cjpm test --no-progress --timeout-each=2m --target-dir target/test
        shell: bash
      # master's alone, so a PR never starts from another PR's build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: |
            target
            build-script-cache
          key: ${{ steps.cache.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: cjls-${{ runner.os }}
          path: target/release/bin/cjls${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  # the coverage-guided fuzzers with the comparisons fjson and jsonrpc make fed back to them, in a
  # target dir of their own; the heap is for cjc's instrumentation, which leaks on every match of
  # an enum (D24)
  fuzz:
    name: Fuzz (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cangjie
      - run: python tests/corpora/fetch.py
        shell: bash
      - run: cjpm test --no-progress --fuzz --target-dir target/fuzz '--filter=*CoverageGuided*.*'
        env:
          cjHeapSize: 2GB

  e2e:
    name: End-to-end (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # no SDK here: the binary has to run the way an editor starts it
    env:
      CJLS_BIN: ${{ github.workspace }}/bin/cjls${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cjls-${{ runner.os }}
          path: bin
      - run: chmod +x "$CJLS_BIN"
        shell: bash
      - uses: astral-sh/setup-uv@v6
      - name: pytest-lsp
        run: uv run --project tests/e2e --locked pytest tests/e2e
        shell: bash

  # the editor clients' own tests against the binary built here (D16): each client at the branch of
  # this one's name when it has one, a change made in both (D32), else at its default branch
  clients:
    name: Editor clients (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # no SDK here either; without it, the tests of cjfmt are skipped
    env:
      CJLS_BIN: ${{ github.workspace }}/bin/cjls${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cjls-${{ runner.os }}
          path: bin
      - run: chmod +x "$CJLS_BIN"
        shell: bash
      - id: nvim
        uses: ide4cj/.github/actions/paired-branch@main
        with:
          repository: ide4cj/cangjie.nvim
      - uses: actions/checkout@v4
        with:
          repository: ide4cj/cangjie.nvim
          ref: ${{ steps.nvim.outputs.ref }}
          path: cangjie.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Neovim plugin tests
        run: nvim --clean --headless -u cangjie.nvim/test/run.lua
        shell: bash
      - id: vscode
        uses: ide4cj/.github/actions/paired-branch@main
        with:
          repository: ide4cj/cangjie-vscode
      - uses: actions/checkout@v4
        with:
          repository: ide4cj/cangjie-vscode
          ref: ${{ steps.vscode.outputs.ref }}
          path: cangjie-vscode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cangjie-vscode/package-lock.json
      - name: VS Code extension tests
        working-directory: cangjie-vscode
        run: |
          npm ci
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
        shell: bash

  # a report per commit, kept as an artifact; shared runners are too noisy for a threshold (D23)
  perf:
    name: Performance (ubuntu-latest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CJLS_BIN: ${{ github.workspace }}/bin/cjls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cjls-Linux
          path: bin
      - run: chmod +x "$CJLS_BIN"
      - uses: astral-sh/setup-uv@v6
      - name: cjls-perf
        run: |
          uv run --project tests/perf --locked cjls-perf run --server cjls -o perf.json
          uv run --project tests/perf --locked cjls-perf compare perf.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ github.sha }}
          path: |
            perf.json
            perf-logs
