[package]
cjc-version = "1.3.0"
name = "macro_host"
organization = ""
description = "Builds the workspace's macro packages with the SDK's cjc and asks the macro server for the calls loupe found"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "static"
compile-option = "-Woff unused"
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
calca = { path = "../calca" }
jsonrpc = { path = "../jsonrpc" }
loupe = { path = "../loupe" }
macro_server = { path = "../macro_server" }
platform = { path = "../platform" }
project_model = { path = "../project_model" }

[test-dependencies]
cjsyntax = { path = "../cjsyntax" }
ginkgo = { path = "../ginkgo" }
rope = { path = "../rope" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"

# CANGJIE_STDX_PATH must name the matching static stdx directory.
[target.aarch64-apple-darwin.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}",
]

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}",
]

[target.x86_64-w64-mingw32.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}",
]
