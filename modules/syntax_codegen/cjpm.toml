[package]
cjc-version = "1.3.0"
name = "syntax_codegen"
organization = ""
description = "Generates a parser's syntax kinds and typed tree views from its kinds file and ungrammar"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "executable"
compile-option = "--static-std"
override-compile-option = ""
link-option = "-lc++"
package-configuration = {}

[dependencies]
ftoml = { path = "../ftoml" }
stdxx = { path = "../stdxx" }

# The tests check what the generator made against the parser it made it for; the generator itself must not need
# that parser, or a broken output could not be made again.
[test-dependencies]
cjsyntax = { path = "../cjsyntax" }
ginkgo = { path = "../ginkgo" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"
