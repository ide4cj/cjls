[package]
cjc-version = "1.3.0"
name = "cjsyntax"
organization = ""
description = "A lossless, error-tolerant Cangjie parser"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "static"
compile-option = ""
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
ginkgo = { path = "../ginkgo" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D50
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"
