[package]
cjc-version = "1.3.0"
name = "ginkgo"
organization = ""
description = "Lossless syntax trees (green/red) and an event-based parser toolkit"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "static"
compile-option = "-Woff unused"
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
py_interop = { git = "https://gitcode.com/filaco/cangjie_python_reverse_interop.git", commitId = "06d296137f4f8451bf6cfc53b686f29569772e50", output-type = "static" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"
