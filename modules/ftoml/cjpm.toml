[package]
cjc-version = "1.3.0"
name = "ftoml"
organization = ""
description = "TOML 1.1 read into a document with spans, and written without one"
version = "1.0.0"
target-dir = ""
script-dir = ""
output-type = "static"
compile-option = ""
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
fnum = { path = "../fnum" }
index_map = { path = "../index_map" }

[test-dependencies]
fjson = { path = "../fjson" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"
