[package]
cjc-version = "1.3.0"
name = "cjformat"
organization = ""
description = "The Cangjie formatter, on cjsyntax's lossless tree: syntax-driven layout at a fixed width"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "static"
compile-option = "-Woff unused"
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
py_interop = { git = "https://gitcode.com/filaco/cangjie_python_reverse_interop.git", commitId = "e77cc51663c1df43efae6107c585aa4a18b0ded2", output-type = "static" }
stdxx = { path = "../stdxx" }
ftoml = { path = "../ftoml" }
cjsyntax = { path = "../cjsyntax" }
ginkgo = { path = "../ginkgo" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"
