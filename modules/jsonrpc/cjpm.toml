[package]
cjc-version = "1.3.0"
name = "jsonrpc"
organization = ""
description = "nothing here"
version = "1.0.0"
target-dir = ""
script-dir = ""
output-type = "static"
compile-option = "-Woff unused"
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
fjson = { path = "../fjson" }
stdxx = { path = "../stdxx" }

# `cjpm test --fuzz`: the comparisons made fed to the coverage-guided fuzzers, in tests alone (D24)
[profile.customized-option]
fuzz = "--sanitizer-coverage-trace-compares"

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"

# CANGJIE_STDX_PATH must name the matching static stdx directory.
[target.aarch64-apple-darwin.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}",
]

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}",
]

[target.x86_64-w64-mingw32.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}",
]
