[package]
cjc-version = "1.3.0"
name = "fbs_codegen"
organization = ""
description = "Generates read-only Cangjie views of a flatbuffers schema"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "executable"
compile-option = "--static-std"
override-compile-option = ""
link-option = "-lc++"
package-configuration = {}

[dependencies]
ftoml = { path = "../ftoml" }
stdxx = { path = "../stdxx" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D50
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"
