[package]
cjc-version = "1.3.0"
name = "project_model"
organization = ""
description = "How Cangjie files make a project: cj-project.json, cjpm.toml or loose files, lowered to loupe's project model"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "static"
compile-option = ""
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
cjsyntax = { path = "../cjsyntax" }
fjson = { path = "../fjson" }
ftoml = { path = "../ftoml" }
loupe = { path = "../loupe" }
stdxx = { path = "../stdxx" }

[test-dependencies]
ginkgo = { path = "../ginkgo" }
rope = { path = "../rope" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"
