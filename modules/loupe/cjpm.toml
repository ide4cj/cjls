[package]
cjc-version = "1.3.0"
name = "loupe"
organization = ""
description = "The analysis of Cangjie code as queries on calca: what an editor asks, with no LSP in it"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "static"
compile-option = ""
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
calca = { path = "../calca" }
cjo = { path = "../cjo" }
cjsyntax = { path = "../cjsyntax" }
ginkgo = { path = "../ginkgo" }
index_map = { path = "../index_map" }
rope = { path = "../rope" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"
