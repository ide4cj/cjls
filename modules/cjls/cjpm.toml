[package]
cjc-version = "1.3.0"
name = "cjls"
organization = ""
description = "nothing here"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "executable"
compile-option = "-O2 --static-std"
override-compile-option = ""
link-option = ""
# `cjpm test` compiles `cjls` into a test, where `--static` is a warning (driver-arg); `lsp_types`
# is generated, and imports and names what it may not use
package-configuration = { cjls = { compile-option = "--static -Woff driver-arg" }, "cjls.lsp_types" = { compile-option = "-Woff unused" } }

[dependencies]
calca = { path = "../calca" }
fjson = { path = "../fjson" }
jsonrpc = { path = "../jsonrpc" }
loupe = { path = "../loupe" }
rope = { path = "../rope" }
stdxx = { path = "../stdxx" }
