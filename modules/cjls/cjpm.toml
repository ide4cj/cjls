[package]
cjc-version = "1.3.0"
name = "cjls"
organization = ""
description = "nothing here"
version = "0.3.0"
target-dir = ""
script-dir = ""
output-type = "executable"
compile-option = "-O2 --static-std"
override-compile-option = ""
link-option = ""
# `--static` links the runtime into the binary, but `cjpm test` builds this package as a staticlib, where cjc
# warns that the option does nothing: no manifest key reaches the executable's build alone.
# lsp_types is generated: every file imports what any of them may need
package-configuration = { cjls = { compile-option = "--static -Woff driver-arg" }, "cjls.lsp_types" = { compile-option = "-Woff unused" } }

[dependencies]
calca = { path = "../calca" }
fjson = { path = "../fjson" }
jsonrpc = { path = "../jsonrpc" }
loupe = { path = "../loupe" }
project_model = { path = "../project_model" }
rope = { path = "../rope" }
stdxx = { path = "../stdxx" }
