[package]
cjc-version = "1.3.0"
name = "lsp_codegen"
organization = ""
description = "nothing here"
version = "1.0.0"
target-dir = ""
script-dir = ""
output-type = "executable"
compile-option = "--static -Woff unused"
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
cjformat = { path = "../cjformat" }
ftoml = { path = "../ftoml" }
fjson = { path = "../fjson" }
stdxx = { path = "../stdxx" }

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"

# CANGJIE_STDX_PATH must name the matching static stdx directory.
[target.aarch64-apple-darwin.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}",
]

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}",
]

[target.x86_64-w64-mingw32.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}",
]
