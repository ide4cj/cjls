[workspace]
members = [
    "modules/calca",
    "modules/cjformat",
    "modules/cjls",
    "modules/cjo",
    "modules/cjsyntax",
    "modules/fbs_codegen",
    "modules/fjson",
    "modules/fnum",
    "modules/ftoml",
    "modules/ginkgo",
    "modules/index_map",
    "modules/jsonrpc",
    "modules/lsp_codegen",
    "modules/loupe",
    "modules/project_model",
    "modules/rope",
    "modules/stdxx",
    "modules/syntax_codegen",
]
build-members = []
test-members = []
compile-option = ""
override-compile-option = ""
link-option = ""
target-dir = ""
script-dir = ""

[dependencies]

# `-i` on every build and test; cjpm's cache knows nothing of the SDK, hence build.cj (D27)
[profile.build]
incremental = true

# on the tests alone (`--test-only`, not the code under test): std.unittest's `@AssertThrows[E]` checks `e is AssertException`
# in its `catch (e: E)`, unreachable for any `E` not `open`, three warnings a case
[profile.test.build]
compile-option = "-Woff unused"

# stdx is the static one, unpacked per platform as the nightly zips lay it out - see D11
[target.aarch64-apple-darwin.bin-dependencies]
path-option = [
    "${CANGJIE_HOME}/third_party/stdx/darwin_aarch64_cjnative/static/stdx",
]

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = [
    "${CANGJIE_HOME}/third_party/stdx/linux_x86_64_cjnative/static/stdx",
]

[target.x86_64-w64-mingw32.bin-dependencies]
path-option = [
    "${CANGJIE_HOME}/third_party/stdx/windows_x86_64_cjnative/static/stdx",
]

# `-O2` on a release build alone: `-g` (the coverage's) builds unoptimized, D51
[target.aarch64-apple-darwin.release]
compile-option = "-O2"

[target.x86_64-unknown-linux-gnu.release]
compile-option = "-O2"

[target.x86_64-w64-mingw32.release]
compile-option = "-O2"
