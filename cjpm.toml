[workspace]
members = [
    "modules/calca",
    "modules/cjformat",
    "modules/cjls",
    "modules/cjmcp",
    "modules/cjo",
    "modules/cjsyntax",
    "modules/fbs_codegen",
    "modules/fbs",
    "modules/fjson",
    "modules/fnum",
    "modules/ftoml",
    "modules/ginkgo",
    "modules/index_map",
    "modules/jsonrpc",
    "modules/lsp_codegen",
    "modules/loupe",
    "modules/macro_host",
    "modules/macro_server",
    "modules/platform",
    "modules/project_model",
    "modules/rope",
    "modules/stdxx",
    "modules/syntax_codegen",
]
build-members = []
test-members = []
compile-option = "-Woff unused"
override-compile-option = ""
link-option = ""
target-dir = ""
script-dir = ""

[dependencies]

# Cangjie multiplatform, which `platform` is (D101): cjpm wants it of the workspace as well as the module
[profile]
experimental = true

# `-i` on every build and test; cjpm's cache knows nothing of the SDK, hence build.cj (D27)
[profile.build]
incremental = true

# the diagnostics gate infers every body of the workspace in one database, as the server does with
# the heap it starts itself with (D31)
[profile.test.env]
cjHeapSize = { value = "2GB", splice-type = "replace" }
